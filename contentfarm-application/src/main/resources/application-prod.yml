server:
  servlet:
    context-path: /api
  port: ${CONTENTFARM_PORT}
  forward-headers-strategy: framework

spring:
  application:
    name: blogpost-service
  config:
    import: optional:aws-secretsmanager:${CONTENTFARM_SECRET_NAME:contentfarm/prod}
  cloud:
    aws:
      region:
        static: ${AWS_S3_REGION}
  datasource:
    url: ${POSTGRESQL_JDBC_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CONTENTFARM_AUTH_SERVER_URL}

contentfarm:
  oauth:
    redirect-uri: ${CONTENTFARM_OAUTH_REDIRECT_URI:https://YOUR_DOMAIN/login/oauth2/code/contentfarm-admin}
    post-logout-redirect-uri: ${CONTENTFARM_OAUTH_POST_LOGOUT_REDIRECT_URI:https://YOUR_DOMAIN/}
  cdn:
    media-base-url: ${CONTENTFARM_CDN_MEDIA_BASE_URL:}
  cloudfront:
    origin-secret: ${CONTENTFARM_CLOUDFRONT_ORIGIN_SECRET:}

file:
  operation:
    aws:
      s3:
        accessKey: ${AWS_S3_ACCESS_KEY:}
        secretKey: ${AWS_S3_SECRET_KEY:}
        region: ${AWS_S3_REGION}
        endpoint: ${AWS_S3_ENDPOINT:}

elasticsearch:
  url: ${ELASTICSEARCH_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
