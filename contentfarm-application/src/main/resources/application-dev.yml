spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: test
    password: test
  config:
    import: classpath:.s3.secret.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:80/api

contentfarm:
  oauth:
    redirect-uri: http://127.0.0.1:8080/login/oauth2/code/contentfarm-admin
    post-logout-redirect-uri: http://127.0.0.1:8080/

file:
  operation:
    aws:
      s3:
        accessKey: ${AWS_S3_ACCESS_KEY}
        secretKey: ${AWS_S3_SECRET_KEY}
        region: ${AWS_S3_REGION}
        endpoint: ${AWS_S3_ENDPOINT:}

logging:
  level:
    org.springframework.security: trace

kafka:
  producerBootstrapServer: localhost:9093
  consumerBootstrapServer: localhost:9093

elasticsearch:
  url: "localhost:9200"
